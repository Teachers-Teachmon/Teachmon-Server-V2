spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/teachmon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        generate_statistics: false
    database-platform: org.hibernate.dialect.MySQLDialect
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test
            client-secret: test
            scope: email,profile
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/google
  main:
    allow-bean-definition-overriding: true

jwt:
  secret: testsecretkeytestsecretkeytestsecretkey
  access-expiration: 1800000
  refresh-expiration: 604800000

auth-code:
  expiration: 300000

web:
  front-end-url: http://localhost:3000

google-spreadsheet:
  enabled: false
  credentials: "test"
  application-name: "test"
  credentials-scope: "test"
